<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeGen | Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #38bdf8;
        --secondary: #818cf8;
        --dark: #0f172a;
        --glass: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
        background: linear-gradient(-45deg, #0f172a, #1e293b, #0f172a, #1e1b4b);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
        50% { background-position: 100% 50%; filter: hue-rotate(30deg); }
        100% { background-position: 0% 50%; filter: hue-rotate(0deg); }
    }

    /* Bubbles Animation */
    .bubbles {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
    }
    .bubble {
        position: absolute;
        bottom: -100px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        animation: rise var(--duration) infinite ease-in;
        left: var(--left);
        width: var(--size);
        height: var(--size);
    }
    @keyframes rise {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(-120vh) rotate(720deg); opacity: 0; }
    }

    .container {
        background: var(--glass);
        backdrop-filter: blur(20px);
        padding: 40px 40px;
        border-radius: 30px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 480px;
        animation: fadeInContainer 1s ease-out, float 6s ease-in-out infinite;
    }

    @keyframes fadeInContainer {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .stagger-1 { animation: fadeIn 0.8s ease-out 0.2s both; }
    .stagger-2 { animation: slideInFromLeft 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s both; }
    .stagger-3 { animation: fadeIn 0.8s ease-out 0.6s both; }

    @keyframes slideInFromLeft {
        from { opacity: 0; transform: translateX(-150px); }
        to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        text-align: center;
        font-size: 32px;
        margin-bottom: 5px;
        font-weight: 700;
    }
    p.subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .input-row { display: flex; gap: 15px; }
    .input-group { margin-bottom: 20px; flex: 1; }
    .input-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #cbd5e1;
    }
    .input-group input, .input-group select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
        color: #fff;
        font-size: 15px;
        transition: 0.3s;
    }
    .input-group select option { background: #0f172a; color: white; }
    .input-group input:focus, .input-group select:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.06);
    }

    /* Password Strength Meter */
    .strength-wrapper {
        margin-top: 8px;
    }
    .strength-bar-bg {
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        overflow: hidden;
    }
    .strength-bar {
        height: 100%;
        width: 0%;
        border-radius: 10px;
        transition: width 0.4s ease, background 0.4s ease;
    }
    .strength-label {
        margin-top: 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: color 0.3s;
        min-height: 16px;
    }
    .strength-label.weak   { color: #f87171; }
    .strength-label.medium { color: #fbbf24; }
    .strength-label.strong { color: #34d399; }

    /* Shake animation for weak password alert */
    @keyframes shake {
        0%,100% { transform: translateX(0); }
        20%,60% { transform: translateX(-6px); }
        40%,80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }

    .btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #0f172a;
        font-weight: 700;
        font-size: 16px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
        margin-top: 10px;
    }
    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
    }

    .link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #94a3b8;
    }
    .link a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }
    .link a:hover { text-decoration: underline; }

    .logo-container {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
    }
</style>
</head>
<body>
  <div class="bubbles">
    <div class="bubble" style="--left: 10%; --size: 80px; --duration: 8s;"></div>
    <div class="bubble" style="--left: 20%; --size: 30px; --duration: 12s; --delay: 2s;"></div>
    <div class="bubble" style="--left: 35%; --size: 50px; --duration: 10s; --delay: 4s;"></div>
    <div class="bubble" style="--left: 50%; --size: 20px; --duration: 7s; --delay: 1s;"></div>
    <div class="bubble" style="--left: 65%; --size: 100px; --duration: 15s; --delay: 3s;"></div>
    <div class="bubble" style="--left: 80%; --size: 40px; --duration: 9s; --delay: 5s;"></div>
    <div class="bubble" style="--left: 90%; --size: 60px; --duration: 11s; --delay: 2s;"></div>
    <div class="bubble" style="--left: 15%; --size: 25px; --duration: 6s; --delay: 3s;"></div>
    <div class="bubble" style="--left: 45%; --size: 70px; --duration: 13s; --delay: 0s;"></div>
    <div class="bubble" style="--left: 75%; --size: 35px; --duration: 8s; --delay: 4s;"></div>
  </div>
  <div class="container">

    <h2 class="stagger-2" style="letter-spacing: 5px; text-transform: uppercase; font-size: 42px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SIGN UP</h2>
    <form id="signupForm" class="stagger-3">
      <div class="input-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Dr. Jane Smith" required>
      </div>
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="jane.smith@university.edu" required>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
        <div class="strength-wrapper">
          <div class="strength-bar-bg"><div class="strength-bar" id="strengthBar"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>
      </div>

      <div class="input-group">
        <label for="department">Administrative Department</label>
        <select id="department" name="department" required>
            <option value="" disabled selected>Select Department</option>
            <option value="BCA">BCA (Computer Applications)</option>
            <option value="BSc">BSc (Science)</option>
            <option value="BCom">BCom (Commerce)</option>
        </select>
      </div>

      <button type="submit" class="btn">Create Account</button>
    </form>
    <div class="link stagger-3">Already registered? <a href="login.html">Log In</a></div>
  </div>

  <script>
    /* ── Password Strength Logic ── */
    function getStrength(pwd) {
      let score = 0;
      if (pwd.length >= 8)  score++;
      if (pwd.length >= 12) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;
      if (score <= 1) return 'weak';
      if (score <= 3) return 'medium';
      return 'strong';
    }

    const pwdInput    = document.getElementById('password');
    const strengthBar = document.getElementById('strengthBar');
    const strengthLabel = document.getElementById('strengthLabel');

    const strengthConfig = {
      weak:   { width: '33%',  bg: '#f87171', text: '⚠️  Weak — add uppercase, numbers & symbols',  cls: 'weak'   },
      medium: { width: '66%',  bg: '#fbbf24', text: '🔶  Moderate — almost there, add more variety', cls: 'medium' },
      strong: { width: '100%', bg: '#34d399', text: '✅  Strong password!',                           cls: 'strong' }
    };

    pwdInput.addEventListener('input', () => {
      const val = pwdInput.value;
      if (!val) {
        strengthBar.style.width = '0%';
        strengthLabel.textContent = '';
        strengthLabel.className = 'strength-label';
        return;
      }
      const level = getStrength(val);
      const cfg   = strengthConfig[level];
      strengthBar.style.width      = cfg.width;
      strengthBar.style.background = cfg.bg;
      strengthLabel.textContent    = cfg.text;
      strengthLabel.className      = 'strength-label ' + cfg.cls;
    });

    /* ── Form Submit ── */
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name       = document.getElementById('name').value;
        const email      = document.getElementById('email').value;
        const password   = pwdInput.value;
        const department = document.getElementById('department').value;

        /* Block weak passwords */
        if (getStrength(password) === 'weak') {
          pwdInput.classList.remove('shake');
          void pwdInput.offsetWidth; // reflow to restart animation
          pwdInput.classList.add('shake');
          strengthLabel.textContent = '⚠️  Password is too weak! Use 8+ chars, uppercase, numbers & symbols.';
          strengthLabel.className   = 'strength-label weak';
          pwdInput.focus();
          return;
        }

        try {
            const response = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, department })
            });

            const data = await response.json();
            if (response.ok) {
                alert(data.message || 'Account created successfully! Your password has been sent to your email. Please log in.');
                window.location.href = 'login.html';
            } else {
                alert(data.message || 'Signup failed');
            }
        } catch (error) {
            console.error('Signup error:', error);
            alert('Server error, please try again later');
        }
    });
  </script>
</body>
</html>
